spring.application.name=cantinmoci

# Importa application-local.properties se ele existir (arquivo local, fora
# do Git, com os segredos de desenvolvimento). "optional:" faz o Spring
# simplesmente ignorar essa linha quando o arquivo nao existir — e o caso
# em producao (Render), onde esse arquivo nunca chega, pois nao esta no Git.
spring.config.import=optional:classpath:application-local.properties

# Banco de Dados
# url e username tem valores padrao seguros (nao sao segredo, funcionam
# direto no seu Postgres local). A senha propositalmente NAO tem valor
# padrao aqui — ela vem do application-local.properties (dev local) ou da
# variavel de ambiente DATABASE_PASSWORD (producao, configurada no Render).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cantinmoci}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Servidor
# PORT — o Render injeta essa variavel automaticamente com a porta que a
# aplicacao deve escutar em producao. Localmente cai no fallback 8080.
server.port=${PORT:8080}

# JWT
# jwt.secret tambem nao tem valor padrao aqui, pelo mesmo motivo da senha
# do banco: vem do application-local.properties (dev local) ou da variavel
# JWT_SECRET (producao, no Render).
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (Fase 8)
# Dominios autorizados a chamar a API a partir do navegador. Lista separada
# por virgula (sem espacos). Fallback: endereco padrao do Vite em dev local.
# Em producao, configurar CORS_ALLOWED_ORIGINS no Render com o dominio real
# do frontend publicado.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
